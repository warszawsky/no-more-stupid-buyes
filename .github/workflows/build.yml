name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # lets electron-builder attach installers to a release on v* tags

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Self-test the app under a virtual display
        run: |
          sudo apt-get install -y -q xvfb x11-utils > /dev/null
          xvfb-run -a npx electron --no-sandbox . --self-test=selftest.json || true
          cat selftest.json
          node -e "const r=require('./selftest.json'); if(!r.rendererReady||!r.tray) process.exit(1)"

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build installer and portable exe
        run: npm run dist:win -- --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Self-test the packaged app
        shell: pwsh
        timeout-minutes: 3
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'selftest.json'
          $p = Start-Process -FilePath 'dist\win-unpacked\No More Stupid Buys.exe' -ArgumentList "--self-test=$report" -PassThru -Wait
          Get-Content $report
          if ($p.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: no-more-stupid-buys-windows
          path: dist/*.exe
          if-no-files-found: error

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:mac -- --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: no-more-stupid-buys-macos
          path: dist/*.dmg
          if-no-files-found: error
